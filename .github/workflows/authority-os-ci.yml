name: Authority OS CI

on:
  push:
    branches:
      - authority-os-v1

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: authority-os
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: authority-os/pnpm-lock.yaml
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
