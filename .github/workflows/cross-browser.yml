name: Cross-browser responsive audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cross-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build and run preservation checks
        run: npm run build
      - name: Install pinned browser test runner
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium firefox webkit
      - name: Start local production build
        run: |
          node scripts/preview-server.mjs 4173 > /tmp/mharisaslam-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/mharisaslam-preview.log
          exit 1
      - name: Audit all routes in Chromium, Firefox and WebKit
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node tests/cross-browser.mjs
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-browser-audit
          path: artifacts/
          retention-days: 14
