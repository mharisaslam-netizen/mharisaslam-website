<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Temporary viewport QA</title><style>body{margin:0;background:#dce0e8;font:16px Arial}header{padding:12px 20px;display:flex;gap:20px;align-items:center;background:white;position:sticky;top:0;z-index:2}select{font:inherit;padding:8px}main{padding:18px}#frame-wrap{margin:auto;position:relative}iframe{border:0;background:white;display:block;transform-origin:top left;max-width:none}</style></head><body><header><strong>Viewport QA</strong><label>Width <select id="size"><option value="1440">1440 desktop</option><option value="1280">1280 laptop</option><option value="768">768 tablet</option><option value="390">390 phone</option><option value="320">320 small phone</option></select></label></header><main><div id="frame-wrap"><iframe title="Business Performance" src="/business-performance" width="1440" height="6000"></iframe></div></main><script>const f=document.querySelector('iframe'),s=document.querySelector('select'),w=document.querySelector('#frame-wrap');function fit(){const width=Number(s.value),scale=Math.min(1,(innerWidth-36)/width);f.width=width;f.style.transform=`scale(${scale})`;w.style.width=(width*scale)+'px';requestAnimationFrame(()=>{const h=f.contentDocument.documentElement.scrollHeight;f.height=h+20;w.style.height=((h+20)*scale)+'px'})}s.addEventListener('change',fit);f.addEventListener('load',()=>{fit();new ResizeObserver(fit).observe(f.contentDocument.body)});addEventListener('resize',fit);</script></body></html>
